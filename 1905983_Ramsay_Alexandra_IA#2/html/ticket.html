<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tix-page"> 
    <header>
    <nav class="navbar">
      <img src="../assets/images/logo-full.svg" alt="Coding Conf logo">
        <ul class="navtab"> 
          <li><a href="index.html" aria-current="page">Home</a></li>
          <li><a href="login.html">Register</a></li>
        </ul>
    </nav>
    </header>
   <main class="page">
        <section class="tix-intro">
            <img src="/assets/images/logo-full.svg" alt="Coding Conf"> 
            <h1>Congrats, <span id="name-gradient">Jonatan Kristof</span>!<br>Your ticket is ready.</h1>
            <p>We've emailed your ticket to <span id="tix-email">@jkristoff@gmail.com</span> and will send updates in the run up to the event.</p>
        </section>

        <div class="tix-container">
            <div class="tix-logo">
                <img src="/assets/images/logo-mark.svg" alt="Coding Conf Logo"> 
                Coding Conf
            </div>

            <p class="tix-date">October 26, 2026 / Austin, TX</p>

            <div class="user-info">
                <img id="avatar" src="/assets/images/image-avatar.jpg" alt="Profile Photo">
                <div>  
                    <span id="tix-name">Jonatan Kristof</span>
                    <div class="github-username">
                        <img src="/assets/images/icon-github.svg" alt="">
                        <span id="github-handle">@jonatankristof0101</span>
                    </div>
                </div>
            </div>

            <p class="tix-number" id="ticket-number">#01609</p>

        </div>
   </main>
    
   <script src="../js/ticket.js"></script>
</body>
</html>
